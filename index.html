<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ts2</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <main>
      <div class="container">
        <div class="calculator">
          <div class="heading">
            <h1>Mortgage Calculator</h1>
            <button class="clear">Clear All</button>
          </div>
          <form>
            <div class="mortgage_container">
              <span class="currency">£</span>
              <label for="mortgage_amount">Mortgage Amount</label>
              <input type="number" id="mortgage_amount" />
            </div>
            <div class="wrapper">
              <div class="term_container">
                <label for="term">Mortgage Term</label>
                <input type="number" id="term" />
                <span class="duration">years</span>
              </div>
              <div class="rate_container">
                <label for="rate">Mortgage Rate</label>
                <input type="number" id="rate" />
                <span class="percent">%</span>
              </div>
            </div>
          </form>
        </div>
        <div class="output"></div>
      </div>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
